<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#E4DDF5" />
<title>Offline – Halmduell</title>
<link rel="icon" href="/favicon.svg" />
<style>
	:root { --grund: #e4ddf5; --text: #2a1c14; --text-2: #4a3a60; --knopf: #2f7d3b; --knopf-text: #fff; --kontur: #2a1c14; color-scheme: light; }
	@media (prefers-color-scheme: dark) {
		:root { --grund: #1c1f33; --text: #eef3ea; --text-2: #c9c3e0; --knopf: #5fae66; --knopf-text: #0b120c; --kontur: #0b120c; color-scheme: dark; }
	}
	* { box-sizing: border-box; }
	body {
		margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem;
		background: var(--grund); color: var(--text); text-align: center;
		font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif; font-weight: 600;
	}
	main { display: grid; justify-items: center; gap: 0.6rem; max-width: 22rem; }
	h1 { margin: 0.4rem 0 0; font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif; font-size: 2rem; line-height: 1.1; }
	p { margin: 0; color: var(--text-2); line-height: 1.45; }
	button {
		margin-top: 0.8rem; min-height: 54px; padding: 0 1.6rem; font: inherit; font-weight: 800; font-size: 1.15rem;
		background: var(--knopf); color: var(--knopf-text); border: 3px solid var(--kontur); border-bottom-width: 6px;
		border-radius: 16px; cursor: pointer;
	}
	.zzz { animation: schweben 2.4s ease-in-out infinite; }
	@keyframes schweben { 50% { transform: translateY(-3px); } }
	@media (prefers-reduced-motion: reduce) { .zzz { animation: none; } }
</style>
</head>
<body>
<main>
	<svg width="150" height="163" viewBox="0 0 120 130" role="img" aria-label="Halmi schläft">
		<path d="M34 130 C36 100 40 70 48 18" stroke="#C99A2E" stroke-width="4" fill="none" stroke-linecap="round"/>
		<ellipse cx="44" cy="22" rx="3" ry="6" transform="rotate(-25 44 22)" fill="#E3B43C"/><ellipse cx="53" cy="20" rx="3" ry="6" transform="rotate(25 53 20)" fill="#E3B43C"/>
		<ellipse cx="42" cy="32" rx="3" ry="6" transform="rotate(-25 42 32)" fill="#E3B43C"/><ellipse cx="51" cy="30" rx="3" ry="6" transform="rotate(25 51 30)" fill="#E3B43C"/>
		<path d="M54 80 L80 52" stroke="#2F7D3B" stroke-width="9" stroke-linecap="round"/>
		<path d="M80 52 L68 94" stroke="#2F7D3B" stroke-width="4" stroke-linecap="round"/>
		<path d="M68 94 L77 96" stroke="#2F7D3B" stroke-width="4" stroke-linecap="round"/>
		<ellipse cx="64" cy="82" rx="27" ry="12" transform="rotate(-18 64 82)" fill="#58B85F"/>
		<path d="M44 88 C58 72 78 66 88 68 C78 75 63 83 44 88 Z" fill="#9EDB9E"/>
		<path d="M74 91 L72 102 M82 88 L84 100" stroke="#2F7D3B" stroke-width="3" stroke-linecap="round"/>
		<circle cx="92" cy="66" r="13" fill="#62C46A"/>
		<path d="M91 62 Q96 66 101 62" stroke="#2A1C14" stroke-width="2.4" fill="none" stroke-linecap="round"/>
		<circle cx="95" cy="74" r="2.2" fill="#2A1C14"/>
		<path d="M94 54 C100 48 108 52 112 62 M88 54 C84 46 78 48 74 56" stroke="#2F7D3B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
		<g class="zzz" fill="currentColor" font-family="system-ui, sans-serif" font-weight="800">
			<text x="104" y="40" font-size="10">z</text><text x="110" y="30" font-size="13">z</text><text x="100" y="22" font-size="8">z</text>
		</g>
	</svg>
	<h1>Keine Verbindung</h1>
	<p>Halmi macht ein Nickerchen, bis das Netz wieder da ist. Deine Duelle sind sicher auf dem Server gespeichert.</p>
	<button type="button" onclick="location.reload()">Erneut versuchen</button>
</main>
<script>
	// automatisch weiter, sobald das Gerät wieder online ist
	addEventListener('online', () => location.reload());
</script>
</body>
</html>
